# Serves the guard secret-masking-defeated-by-transform, which must leak.
#
# Masking is a literal string replacement over log output: it searches for the
# bytes of the secret. Every step here writes different bytes that a reader can
# trivially turn back into the secret, so masking finds nothing to replace.
#
# This is not a misconfiguration to fix. It is what masking is, and a pipeline
# that treats it as a control against the code it runs has misunderstood what
# it bought. The value is mapped through env rather than macro syntax on
# purpose: that is how a real pipeline hands a secret to a script, and it makes
# the point that the leak needs no privilege and no mistake, only the value and
# a pipe.

trigger: none
pr: none

pool:
  name: $(agentPool)

steps:
  - script: |
      echo "TRANSFORM_STEP_RAN"
      printf '%s' "$SECRET" | base64 -w0
      echo
    displayName: Print it base64-encoded (expected to leak)
    env:
      SECRET: $(drillSecret)

  # A second transform, because one could be dismissed as a quirk of base64.
  # Printed one character at a time the value is never a substring of the log,
  # so masking has nothing to match, while remaining perfectly readable.
  - script: |
      echo "SEPARATED_STEP_RAN"
      printf '%s' "$SECRET" | fold -w1 | tr '\n' ' '
      echo
    displayName: Print it one character at a time (expected to leak)
    env:
      SECRET: $(drillSecret)

  # Reversed, which is the cheapest of the three and needs no tooling at all.
  - script: |
      echo "REVERSED_STEP_RAN"
      printf '%s' "$SECRET" | rev
      echo
    displayName: Print it reversed (expected to leak)
    env:
      SECRET: $(drillSecret)
