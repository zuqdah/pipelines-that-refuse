# Serves the guard secret-masked-in-log, which must pass.
#
# Deliberately a separate pipeline from secret-transformed.yml. One pipeline
# printing both the plain value and a transformed one would leak, and a scan of
# that run's log would report THIS guard as failed -- of a masking feature that
# worked exactly as documented. Two runs, two clean logs, two honest answers.
#
# The marker is printed before the value is touched. A log without it is a log
# from a step that did not run, and the drill reports that as Unknown rather
# than as evidence of masking. Three labs in this series have been caught
# reporting success from an operation that never executed.

trigger: none
pr: none

pool:
  name: $(agentPool)

steps:
  # Macro syntax is substituted by the agent, and the value is replaced with
  # asterisks on its way to the log. This is the behaviour everybody has
  # watched work, and it does work. It is here so the companion pipeline's
  # finding means something: without this, a leak there could equally be a
  # broken variable, an unmapped secret, or a run that never happened.
  - script: |
      echo "SECRET_STEP_RAN"
      echo "plain: $(drillSecret)"
    displayName: Print the secret directly (expected to be masked)
