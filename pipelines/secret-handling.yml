# Serves two guards: secret-masked-in-log, which must pass, and
# secret-masking-defeated-by-transform, which must leak.
#
# The order matters. Proving masking fails on a transformed value means nothing
# unless masking is first shown to work on the plain one -- otherwise a broken
# variable, an unmapped secret or a pipeline that never ran all produce the
# same "leak" and none of them are findings.
#
# Every step prints a marker before touching the value. A log without the
# marker is a log from a step that did not run, and the drill reports that as
# Unknown rather than as evidence of masking. Three labs in this series have
# been caught reporting success from an operation that never executed.

trigger: none
pr: none

pool:
  name: $(agentPool)

steps:
  # The baseline. Macro syntax is substituted by the agent and the value is
  # replaced with asterisks on its way to the log. This is the behaviour
  # everybody has watched work, and it does work.
  - script: |
      echo "SECRET_STEP_RAN"
      echo "plain: $(drillSecret)"
    displayName: Print the secret directly (expected to be masked)

  # The same value, encoded. Masking is a literal string replacement over log
  # output: it looks for the bytes of the secret and finds nothing, because
  # these are different bytes that decode to it.
  #
  # Mapped through env rather than macro syntax on purpose -- this is how a
  # real pipeline hands a secret to a script, and it makes the point that the
  # leak needs no privilege and no mistake, only the value and a pipe.
  - script: |
      echo "TRANSFORM_STEP_RAN"
      printf '%s' "$SECRET" | base64 -w0
      echo
    displayName: Print it base64-encoded (expected to leak)
    env:
      SECRET: $(drillSecret)

  # A second transform, because one could be dismissed as a quirk of base64.
  # Printed one character at a time, the value never appears as a substring and
  # masking has nothing to match, while remaining perfectly readable.
  - script: |
      echo "SEPARATED_STEP_RAN"
      printf '%s' "$SECRET" | fold -w1 | tr '\n' ' '
      echo
    displayName: Print it one character at a time (expected to leak)
    env:
      SECRET: $(drillSecret)

  # Reversed, which is the cheapest of the three and needs no tooling at all.
  - script: |
      echo "REVERSED_STEP_RAN"
      printf '%s' "$SECRET" | rev
      echo
    displayName: Print it reversed (expected to leak)
    env:
      SECRET: $(drillSecret)
