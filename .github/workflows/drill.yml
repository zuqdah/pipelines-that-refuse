name: Drill

# Manual only. The drill creates a project, four identities and an agent
# registration, then destroys all of it; nothing about that belongs on a push
# trigger. The nightly schedule lives in destroy.yml, which cleans up after a
# run that died before its own teardown.
on:
  workflow_dispatch:
    inputs:
      passes:
        description: Which policy configurations to drill
        type: choice
        default: both
        options: [both, permissive, hardened]
      keep:
        description: Skip the teardown (for debugging a failed run). The nightly destroy will still remove it.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # the whole authentication model depends on this

concurrency:
  # One drill at a time. Two would share an organization, a pool and a project
  # name, and the second would grade its guards against the first one's policy.
  group: guard-drill
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  drill:
    name: Attempt every bypass
    runs-on: ubuntu-latest
    # Names the environment in the OIDC subject claim the federated credentials
    # trust. Remove it and every token exchange fails, which the drill would
    # report as eleven AuthFailures rather than as a configuration mistake --
    # so it checks for the request token up front and says so instead.
    environment: lab
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Build the agent image
        run: docker build -t guard-drill-agent:local agent

      - name: Apply the permissive configuration
        id: apply
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -auto-approve -input=false \
            -var 'pass=permissive' \
            -var 'organization=${{ vars.ADO_ORGANIZATION }}' \
            -var 'github_oidc_subject=repo:${{ github.repository }}:environment:lab'
          terraform -chdir=infra output -json > tf-output.json

      # Started after the apply, because the pool it registers into is created
      # by it. The token is the one secret in this lab: scoped to Agent Pools
      # (read, manage), never in Terraform, never in a pipeline variable.
      - name: Start the self-hosted agent
        run: |
          docker run -d --name guard-agent \
            -e AZP_URL="https://dev.azure.com/${{ vars.ADO_ORGANIZATION }}" \
            -e AZP_POOL="$(terraform -chdir=infra output -raw agent_pool_name)" \
            -e AZP_TOKEN="${{ secrets.AZP_TOKEN }}" \
            guard-drill-agent:local

          # An agent that never comes online turns every pipeline guard into a
          # run that waits, and a run that waits looks exactly like a run held
          # at an approval. Waiting for the log line here means a registration
          # failure is reported as itself.
          for _ in $(seq 1 30); do
            if docker logs guard-agent 2>&1 | grep -q 'Waiting for jobs'; then
              echo "Agent is online."
              exit 0
            fi
            if ! docker ps --filter name=guard-agent --filter status=running -q | grep -q .; then
              echo "::error::The agent container exited during registration."
              docker logs guard-agent
              exit 1
            fi
            sleep 5
          done
          echo "::error::The agent did not come online within 150 seconds."
          docker logs guard-agent
          exit 1

      # Entra takes roughly three minutes to propagate a federated credential,
      # and the failure for one that does not exist yet is indistinguishable
      # from one whose subject will never match. Sleeping is cruder than
      # retrying but it is honest about what is being waited for.
      - name: Wait for the federated credentials to propagate
        run: sleep 180

      - name: Drill the permissive configuration
        if: inputs.passes == 'both' || inputs.passes == 'permissive'
        shell: pwsh
        run: |
          ./scripts/Invoke-GuardDrill.ps1 `
            -TerraformOutput tf-output.json `
            -Pass permissive `
            -ReportPath guard-report-permissive.json `
            -MarkdownPath guard-report-permissive.md

      - name: Apply the hardened configuration
        if: inputs.passes == 'both' || inputs.passes == 'hardened'
        run: |
          terraform -chdir=infra apply -auto-approve -input=false \
            -var 'pass=hardened' \
            -var 'organization=${{ vars.ADO_ORGANIZATION }}' \
            -var 'github_oidc_subject=repo:${{ github.repository }}:environment:lab'
          terraform -chdir=infra output -json > tf-output.json

      - name: Drill the hardened configuration
        if: inputs.passes == 'both' || inputs.passes == 'hardened'
        shell: pwsh
        run: |
          ./scripts/Invoke-GuardDrill.ps1 `
            -TerraformOutput tf-output.json `
            -Pass hardened `
            -ReportPath guard-report-hardened.json `
            -MarkdownPath guard-report-hardened.md

      - name: Summarise
        if: always()
        shell: pwsh
        run: |
          foreach ($file in @('guard-report-permissive.md', 'guard-report-hardened.md')) {
            if (Test-Path $file) {
              Get-Content $file | Out-File $env:GITHUB_STEP_SUMMARY -Append
              '' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            }
          }

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: guard-reports
          path: guard-report-*
          if-no-files-found: warn

      # Runs even when the drill failed, because a failed drill still created a
      # project, four Entra applications and an agent registration. The only
      # thing that skips it is asking for it to be skipped.
      - name: Stop the agent
        if: always()
        run: |
          docker stop guard-agent || true
          docker logs guard-agent 2>&1 | tail -30 || true

      - name: Destroy
        if: always() && !inputs.keep
        run: |
          terraform -chdir=infra destroy -auto-approve -input=false \
            -var 'pass=permissive' \
            -var 'organization=${{ vars.ADO_ORGANIZATION }}' \
            -var 'github_oidc_subject=repo:${{ github.repository }}:environment:lab'

      # Verified against the service, not inferred from the destroy step's exit
      # code. Every lab in this series checks its own teardown, because a
      # destroy that reported success while leaving a project behind is how a
      # throwaway organization accumulates permanent state.
      - name: Verify the teardown
        if: always() && !inputs.keep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remaining = @(terraform -chdir=infra state list 2>$null)
          if ($remaining.Count) {
            Write-Output "State still holds $($remaining.Count) resource(s):"
            $remaining | ForEach-Object { Write-Output "  $_" }
            throw 'Teardown incomplete.'
          }
          Write-Output 'State is empty. Teardown verified.'
